name: CTX App Build (fast iteration)
# 日常迭代用这条：不重编终端运行时（跨 run 下载），cargo 走缓存，只出 APK 不打 module
on:
  # 非默认分支上 workflow_dispatch 不可用，改用 push 触发：推送到 ci/ctx-build 或任意 build/** 分支即出 APK
  push:
    branches: ['ci/ctx-build', 'build/**']
  workflow_dispatch:
    inputs:
      runtime_run_id:
        description: "ctx-runtime-build 那次 run 的 ID（留空 = 自动取 ci/ctx-runtime 最近一次成功 run）"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-android:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve runtime artifact names
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}"
          $runId = "${{ inputs.runtime_run_id }}"
          if ([string]::IsNullOrWhiteSpace($runId)) {
            # workflow 实体不在默认分支注册：服务端按名/分支过滤均不可用，拉取后在本地筛
            $resp = gh api "repos/$repo/actions/runs?per_page=100" | ConvertFrom-Json
            $run = $resp.workflow_runs | Where-Object {
              $_.head_branch -eq 'ci/ctx-runtime' -and
              $_.name -eq 'CTX Runtime Build (one-time)' -and
              $_.status -eq 'completed' -and $_.conclusion -eq 'success'
            } | Select-Object -First 1
          } else {
            $run = gh api "repos/$repo/actions/runs/$runId" | ConvertFrom-Json
          }
          if (-not $run) {
            throw "未找到成功的 ctx-runtime-build run：请先在 ci/ctx-runtime 分支上跑一次该 workflow"
          }
          "RUN_ID=$($run.id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RUNTIME_ARTIFACT=operit2-android-runtime-$($run.head_sha)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "V8_ARTIFACT=operit2-android-v8-$($run.head_sha)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download Android terminal runtime (reuse, no rebuild)
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RUNTIME_ARTIFACT }}
          path: apps/flutter/app/android/app/src/main
          repository: ${{ github.repository }}
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Android V8 (reuse, no rebuild)
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V8_ARTIFACT }}
          path: tools/release/work/android-v8
          repository: ${{ github.repository }}
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install FVM
        shell: pwsh
        run: |
          dart pub global activate fvm $env:FVM_VERSION
          "$env:APPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        shell: pwsh
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android

      - name: Rust cache (cargo registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          cache-targets: "true"
          key: ctx-iter

      - name: Prepare Android bindgen libclang
        shell: pwsh
        run: |
          $version = "21.1.8"
          $packageName = "libclang.runtime.win-x64.$version"
          $toolsDir = "target/operit-build-tools"
          $packageDir = Join-Path $toolsDir $packageName
          $archive = Join-Path $toolsDir "$packageName.nupkg"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/libclang.runtime.win-x64/$version" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $packageDir -Force
          $libclang = Join-Path $packageDir "runtimes/win-x64/native/libclang.dll"
          if (-not (Test-Path -LiteralPath $libclang)) {
            throw "Android bindgen libclang was not prepared at $libclang"
          }

      - name: Install repository build tools
        shell: pwsh
        run: |
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          corepack enable pnpm
          python -m venv .venv

      - name: Install Emscripten
        shell: pwsh
        run: |
          if (-not (Test-Path .ci-tools/emsdk/emsdk.py)) {
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git .ci-tools/emsdk
          }
          python .ci-tools/emsdk/emsdk.py install 4.0.14
          python .ci-tools/emsdk/emsdk.py activate 4.0.14
          .venv/Scripts/python.exe .ci-tools/emsdk/upstream/emscripten/em++.py --version

      - name: Restore Android signing material
        shell: pwsh
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          $required = @(
            "ANDROID_RELEASE_KEYSTORE_BASE64",
            "ANDROID_RELEASE_STORE_PASSWORD",
            "ANDROID_RELEASE_KEY_ALIAS",
            "ANDROID_RELEASE_KEY_PASSWORD"
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            throw "Missing required GitHub Actions secrets: $($missing -join ', ')"
          }
          $secretsDir = "tools/release/secrets"
          New-Item -ItemType Directory -Force -Path $secretsDir | Out-Null
          $keystore = Join-Path $secretsDir "operit2-release.keystore"
          [System.IO.File]::WriteAllBytes($keystore, [System.Convert]::FromBase64String($env:ANDROID_RELEASE_KEYSTORE_BASE64))
          @"
          RELEASE_STORE_FILE=operit2-release.keystore
          RELEASE_STORE_PASSWORD=$env:ANDROID_RELEASE_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$env:ANDROID_RELEASE_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$env:ANDROID_RELEASE_KEY_PASSWORD
          "@ | Set-Content -Path (Join-Path $secretsDir "android-signing.properties") -Encoding utf8

      - name: Build and package Android app (APK only, no module)
        shell: pwsh
        run: |
          $version = (Select-String -Path apps/flutter/app/pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$').Matches
          if ($version.Count -ne 1) {
            throw "apps/flutter/app/pubspec.yaml must contain exactly one release version line"
          }
          python tools/build_scripts/build_flutter_android.py --build-name $version[0].Groups[1].Value --build-number $version[0].Groups[2].Value --application-id app.operit.test --enforce-lockfile

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-ctx-${{ github.sha }}
          path: tools/release/dist/operit2-app-android-arm64-v8a-*.apk
          if-no-files-found: error
          retention-days: 14